            fail('MIGRATION_RACE_DETECTED', 'Missing attested migration metadata prior to full-chain push.')
          }

          const normalizedDir = (contract.MIGRATION_DIRECTORY ?? '').replace(/^\.\//, '').replace(/\/+$/, '')
          const treeFiles = execFileSync('git', ['ls-tree', '-r', '--name-only', sourceSha], { encoding: 'utf8' })
            .split(/\r?\n/).map((s) => s.trim()).filter(Boolean)
          const prismaPattern = new RegExp(`^${normalizedDir.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}/([^/]+)/migration\\.sql$`)
          const directPattern = new RegExp(`^${normalizedDir.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}/([^/]+)\\.(sql|py)$`)
