          if (dbProvider.toLowerCase() === 'none') {
            process.exit(0)
          }

          const attestedRunId = Number(process.env.MIGRATION_ATTESTED_RUN_ID ?? '')
          const attestedAttempt = Number(process.env.MIGRATION_ATTESTED_RUN_ATTEMPT ?? '1')
          const expectedTree = (process.env.MIGRATION_TREE_SHA256 ?? '').trim()
