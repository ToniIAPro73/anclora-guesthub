            }
          }
          migs.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0))
          const currentTree = sha256Hex(migs.map((m) => `${m.name}:${m.sha256}\n`).join(''))
          if (currentTree !== expectedTree) {
            fail('MIGRATION_RACE_DETECTED', 'Migration tree digest changed between verify and full-chain push.')
          }

          if (!repo) fail('MIGRATION_GITHUB_API_UNAVAILABLE', 'GITHUB_REPOSITORY missing.')
          const workflowFile = runnerWorkflow.replace(/^\.github\/workflows\//, '')
          let payload
          try {
            payload = JSON.parse(execFileSync('gh', ['api', `repos/${repo}/actions/workflows/${encodeURIComponent(workflowFile)}/runs?per_page=100`], { encoding: 'utf8' }))
          } catch (err) {
            fail('MIGRATION_GITHUB_API_UNAVAILABLE', `Failed pre-push migration run recheck: ${err.message}`)
          }
          if (!payload || !Array.isArray(payload.workflow_runs)) {
            fail('MIGRATION_GITHUB_API_UNAVAILABLE', 'Malformed workflow_runs response during full-chain recheck.')
          }
          const runs = payload.workflow_runs
          const targetRun = runs.find((r) => r && r.id === attestedRunId)
          if (!targetRun || targetRun.status !== 'completed' || targetRun.conclusion !== 'success' || (targetRun.run_attempt ?? 1) !== attestedAttempt) {
            fail('MIGRATION_RACE_DETECTED', `Attested migration run ${attestedRunId}#${attestedAttempt} is no longer clean/latest.`)
          }
          const newerConflict = runs.find((r) =>
            r && (r.id > attestedRunId || (r.id === attestedRunId && (r.run_attempt ?? 1) > attestedAttempt)) &&
            (r.status !== 'completed' || r.conclusion !== 'success'),
          )
          if (newerConflict) {
            fail('MIGRATION_RACE_DETECTED', `Concurrent or newer migration run ${newerConflict.id} (${newerConflict.status}/${newerConflict.conclusion}) detected before full-chain push.`)
          }
          console.log(`MIGRATION_PRE_PUSH_REVALIDATED: run=${attestedRunId}#${attestedAttempt}`)
          NODE

      - name: Promote the full chain after fail-closed checks
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::PROMOTION_BLOCKED_$1"; exit 1; }

          # 1. Advance staging ref
          git push origin "$SOURCE_SHA:refs/heads/staging"

          # 2. Inspect runtime contract for optional Render backend gate
          contract="$(git show "$SOURCE_SHA:.anclora/PRODUCTION_RUNTIME.md" 2>/dev/null || true)"
          gate_mode="$(printf '%s\n' "$contract" | grep -E '^BACKEND_COMPAT_GATE=' | head -n 1 || true)"
          gate_mode="${gate_mode#BACKEND_COMPAT_GATE=}"
          service_id="$(printf '%s\n' "$contract" | grep -E '^BACKEND_RENDER_SERVICE_ID=' | head -n 1 || true)"
          service_id="${service_id#BACKEND_RENDER_SERVICE_ID=}"

          target_prod_sha="$(git rev-parse origin/production)"
          backend_changed=false
          if ! git diff --quiet "$target_prod_sha" "$SOURCE_SHA" -- backend/; then
            backend_changed=true
          fi

          # 3. Advance production ref (triggers native Render Auto-Deploy if connected to production)
          git push origin "$SOURCE_SHA:refs/heads/production"

          # 4. If backend changed and Render gate is active, wait boundedly for Render deploy to become live
          if [ "$gate_mode" = "required" ] && [ "$backend_changed" = "true" ]; then
            [ -n "${RENDER_API_KEY:-}" ] || fail "BACKEND_DEPLOY_UNVERIFIABLE: RENDER_API_KEY missing during production advance."
            [[ "$service_id" =~ ^srv-[a-z0-9]+$ ]] || fail "BACKEND_DEPLOY_UNVERIFIABLE: invalid Render service id."

            echo "Backend changed; awaiting Render Auto-Deploy for commit $SOURCE_SHA to reach 'live'..."
            max_attempts=60
            sleep_interval=10
            attempt=1
            deploy_live=false

            while [ "$attempt" -le "$max_attempts" ]; do
              if deploys="$(curl -fsS --max-time 15 \
                  -H "Authorization: Bearer $RENDER_API_KEY" \
                  -H 'Accept: application/json' \
                  "https://api.render.com/v1/services/$service_id/deploys?limit=10" 2>/dev/null)"; then

                deploy_info="$(jq -r --arg sha "$SOURCE_SHA" '
                  [.[] | .deploy? | select(type == "object" and .commit.id == $sha)] | first // empty
                  | if . == null then "NOT_FOUND" else "\(.id)\t\(.status)" end
                ' <<< "$deploys" 2>/dev/null || echo "ERROR")"

                if [ "$deploy_info" != "NOT_FOUND" ] && [ "$deploy_info" != "ERROR" ]; then
                  IFS=$'\t' read -r dep_id dep_status <<< "$deploy_info"
                  echo "Attempt $attempt/$max_attempts: deploy $dep_id status is '$dep_status'..."
                  case "$dep_status" in
                    live)
                      deploy_live=true
                      break
                      ;;
                    build_failed|update_failed|canceled)
                      fail "BACKEND_DEPLOY_FAILED: Render deploy $dep_id ended with status $dep_status."
                      ;;
                    created|queued|in_progress|pre_deploy_in_progress)
                      ;;
                    *)
                      echo "Unhandled deploy status: $dep_status"
                      ;;
                  esac
                else
                  echo "Attempt $attempt/$max_attempts: Render deploy for $SOURCE_SHA not registered yet..."
                fi
              else
                echo "Attempt $attempt/$max_attempts: transient failure reading Render deploys, retrying..."
              fi

              attempt=$((attempt + 1))
              sleep "$sleep_interval"
            done

            [ "$deploy_live" = "true" ] || fail "BACKEND_DEPLOY_TIMEOUT: Render deploy for $SOURCE_SHA did not reach 'live' within $((max_attempts * sleep_interval))s."
            echo "Render deploy for $SOURCE_SHA is live."
          else
            echo "No backend changes or Render gate not required; proceeding directly to main."
          fi

          # 5. Advance main ref (triggers Vercel frontend deploy)
          git push origin "$SOURCE_SHA:refs/heads/main"
