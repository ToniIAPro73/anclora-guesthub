name: Promote / Environment

# Manual, human-gated promotion. Moves target branch ref to exact SHA
# already validated upstream. Fast-forward only: no merge/rebase/
# cherry-pick/force push.
#
# development -> staging -> production -> main

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to promote into, or full chain"
        required: true
        type: choice
        options: [staging, production, main, full]
      source_sha:
        description: "Exact development SHA reviewed in Preview (required for full chain)"
        required: false
        type: string

permissions:
  statuses: read
  contents: write
concurrency:
  group: promote-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.target != 'full'
    name: Promote to ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: inputs.target == 'main' && hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Resolve source branch
        id: source
        run: |
          case "${{ inputs.target }}" in
            staging) echo "branch=development" >> "$GITHUB_OUTPUT" ;;
            production) echo "branch=staging" >> "$GITHUB_OUTPUT" ;;
            main) echo "branch=production" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify fast-forward safety
        run: |
          git fetch origin ${{ steps.source.outputs.branch }} ${{ inputs.target }}
          SOURCE_SHA=$(git rev-parse origin/${{ steps.source.outputs.branch }})
          TARGET_SHA=$(git rev-parse origin/${{ inputs.target }})
          echo "source=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Source (${{ steps.source.outputs.branch }}): $SOURCE_SHA"
          echo "Target (${{ inputs.target }}) current: $TARGET_SHA"
          if [ "$SOURCE_SHA" = "$TARGET_SHA" ]; then
            echo "Already at target SHA. Nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
            echo "::error::PROMOTION_BLOCKED_DIVERGENCE: ${{ inputs.target }} has commits not present in ${{ steps.source.outputs.branch }}. Refusing to move target."
            exit 1
          fi

      - name: Verify source SHA passed its upstream gate
        run: |
          STATUS=$(gh api repos/${{ github.repository }}/commits/$source/status --jq .state)
          echo "Combined status for $source: $STATUS"
          if [ "$STATUS" = "failure" ] || [ "$STATUS" = "error" ]; then
            echo "::error::Source SHA has failing checks. Refusing to promote red code."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fast-forward target ref
        run: git push origin "$source:refs/heads/${{ inputs.target }}"

      - name: Main baseline integrity
        if: inputs.target == 'main' && hashFiles('package-lock.json') != ''
        run: npm ci
  promote_full:
    if: inputs.target == 'full'
    name: Promote development through staging, production, and main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the full chain without waiting for environment checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "development" ]; then
            echo "::error::PROMOTION_BLOCKED_WRONG_REF: dispatch this workflow from development."
            exit 1
          fi
          if [ -z "$SOURCE_SHA" ]; then
            echo "::error::PROMOTION_BLOCKED_MISSING_REVIEWED_SHA: supply the exact SHA shown in Preview."
            exit 1
          fi
          git fetch origin \
            "+refs/heads/development:refs/remotes/origin/development" \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/production:refs/remotes/origin/production" \
            "+refs/heads/main:refs/remotes/origin/main"
          git cat-file -e "$SOURCE_SHA^{commit}"
          current_development_sha="$(git rev-parse origin/development)"
          if [ "$current_development_sha" != "$SOURCE_SHA" ]; then
            echo "::error::PROMOTION_BLOCKED_UNREVIEWED_DEVELOPMENT: development moved after Preview review. Review the new Preview first."
            exit 1
          fi
          source_sha="$SOURCE_SHA"
          echo "Reviewed development SHA: $source_sha"
          source_status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status" --jq .state)"
          if [ "$source_status" = "failure" ] || [ "$source_status" = "error" ]; then
            echo "::error::PROMOTION_BLOCKED_FAILED_SOURCE_CHECKS: development has failing checks."
            exit 1
          fi
          for target in staging production main; do
            target_sha="$(git rev-parse "origin/$target")"
            if ! git merge-base --is-ancestor "$target_sha" "$source_sha"; then
              echo "::error::PROMOTION_BLOCKED_DIVERGENCE: $target has commits outside development."
              exit 1
            fi
          done
          for target in staging production main; do
            git push origin "$source_sha:refs/heads/$target"
          done
