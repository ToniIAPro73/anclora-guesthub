name: CI

on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development, staging, production, main]

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/guesthub"
  DIRECT_URL: "postgresql://user:password@localhost:5432/guesthub"
  SESSION_SECRET: "ci-session-secret-ci-session-secret"
  GUESTHUB_ENCRYPTION_KEY: "ci-encryption-key-ci-encryption-key-32"
  GUESTHUB_ENABLE_PERSISTENT_STORAGE: "false"
  GUESTHUB_LOCAL_DEMO: "true"
  GUESTHUB_ADMIN_PASSWORD: "ci-admin-password"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check public docs policy
        run: npm run check:public-docs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
